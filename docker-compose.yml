# ============================================================
# Docker Compose - 天玺尊邸酒店管理系统
# 企业级生产部署编排
# ============================================================
#
# 使用方式：
#   1. cp deploy/.env.example .env  # 创建配置
#   2. vi .env                      # 填写密钥和密码
#   3. docker compose up -d         # 启动
#   4. docker compose logs -f       # 查看日志
#   5. docker compose down          # 停止
#
# ============================================================

name: hotel-system

# ---- 共享网络 ----
networks:
  hotel-network:
    driver: bridge

# ---- 持久化数据卷 ----
volumes:
  mysql-data:
    driver: local
  nginx-logs:
    driver: local
  frontend-dist:
    driver: local

# ---- 服务定义 ----
services:

  # ========== 数据库 ==========
  db:
    image: mysql:8.0
    container_name: hotel-db
    restart: unless-stopped
    networks:
      - hotel-network
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?必须设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-hotel_system}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"   # 仅本地访问，不对外暴露
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deploy/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ========== FastAPI 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-system-backend:latest
    container_name: hotel-backend
    restart: unless-stopped
    networks:
      - hotel-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 数据库（容器内连接 MySQL）
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:-hotel_system}
      # DeepSeek AI
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?必须设置 DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: deepseek-chat
      DEEPSEEK_BASE_URL: "https://api.deepseek.com/chat/completions"
    expose:
      - "8000"    # 仅对内网暴露
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ========== 前端构建（一次性，非长期运行） ==========
  # 使用方式：docker compose run --rm frontend-builder
  frontend-builder:
    image: node:20-alpine
    container_name: hotel-frontend-builder
    working_dir: /app
    volumes:
      - ./hotel-web:/app
      - frontend-dist:/app/dist   # 写入共享 volume
    command: sh -c "npm ci && npm run build"
    profiles:
      - build    # 仅在指定 profile 时启动

  # ========== Nginx 前端 + 反向代理 ==========
  frontend:
    image: nginx:alpine
    container_name: hotel-frontend
    restart: unless-stopped
    networks:
      - hotel-network
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"           # 对外暴露 HTTP 端口
    volumes:
      # 前端静态文件（从构建 volume 读取）
      - frontend-dist:/usr/share/nginx/html:ro
      # Nginx 配置
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 日志
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
