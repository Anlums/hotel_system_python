knowledge:
  # ============ 入住/退房政策 ============
  - id: "check_in_time"
    category: "policy"
    keywords: ["入住", "check in", "到店", "到达", "办理入住"]
    content: "入住时间为下午 14:00 之后。如需提前入住，需提前联系前台确认空房情况，有空房可免费提前入住。"

  - id: "check_out_time"
    category: "policy"
    keywords: ["退房", "check out", "离店", "离开", "延迟退房"]
    content: "退房时间为中午 12:00 前。金卡会员可延至 14:00，钻石会员可延至 16:00。延迟退房需提前在前台登记，超时按小时收费。"

  - id: "early_check_in"
    category: "policy"
    keywords: ["提前入住", "早到", "凌晨入住"]
    content: "06:00-14:00 期间到店，若房间已准备好可直接入住；若房间未空出，可在大堂休息区等候或寄存行李。过夜入住从入住当日 06:00 开始计算。"

  - id: "late_check_out_fee"
    category: "policy"
    keywords: ["延迟退房收费", "超时费", "加时"]
    content: "延迟至 18:00 前退房加收半天房费，18:00 后退房加收全天房费。钻石及金卡会员享有免费延迟权益，超出免费时段后按标准收费。"

  # ============ 宠物政策 ============
  - id: "pet_policy"
    category: "policy"
    keywords: ["宠物", "狗", "猫", "动物", "携带宠物"]
    content: "酒店允许携带体重 10kg 以下的小型宠物入住，需加收 ¥200/次清洁费。请提前告知前台以便安排宠物友好房间。宠物不可进入餐厅和泳池区域。"

  # ============ 餐饮服务 ============
  - id: "breakfast"
    category: "service"
    keywords: ["早餐", "餐厅", "吃饭", "餐饮", "自助早餐"]
    content: "自助早餐在二楼西餐厅提供，每日 07:00-10:00。住客享 ¥128/位优惠价。总统套房和豪华套房住客含免费双人早餐。"

  - id: "in_room_dining"
    category: "service"
    keywords: ["送餐", "客房送餐", "房间点餐", "room service"]
    content: "24 小时客房送餐服务。可通过客房电视或拨打 0 点餐。深夜 23:00 后提供精选夜宵菜单，约 30 分钟送达。"

  # ============ 接送服务 ============
  - id: "airport_pickup"
    category: "service"
    keywords: ["接机", "机场", "接送", "交通", "专车"]
    content: "提供机场接送服务。奔驰商务车 ¥380/趟，豪华轿车 ¥580/趟。需提前 24 小时预约，联系前台或拨打转 0。"

  - id: "parking"
    category: "service"
    keywords: ["停车", "停车场", "车位", "开车"]
    content: "住客免费停车，地下停车场共 200 个车位。无需预约，进出自动识别车牌。"

  # ============ 设施服务 ============
  - id: "gym"
    category: "facility"
    keywords: ["健身房", "健身", "运动", "锻炼"]
    content: "健身房位于四楼，24 小时开放，住客凭房卡免费使用。配备跑步机、哑铃、瑜伽区等。"

  - id: "pool"
    category: "facility"
    keywords: ["泳池", "游泳", "游泳池", "恒温"]
    content: "室内恒温泳池位于一楼，每日 06:00-22:00 开放。住客免费使用，需自带泳帽。儿童需成人陪同。"

  - id: "laundry"
    category: "service"
    keywords: ["洗衣", "干洗", "熨烫", "洗衣服"]
    content: "提供洗衣和干洗服务。当日 10:00 前送洗，18:00 前送回。加急服务 3 小时送回，加收 50% 费用。"

  # ============ 会员权益 ============
  - id: "member_levels"
    category: "membership"
    keywords: ["会员", "等级", "积分", "银卡", "金卡", "钻石"]
    content: "会员等级：银卡（年消费 5000+）享 9 折；金卡（年消费 20000+）享 85 折 + 延迟退房；钻石卡（年消费 50000+）享 8 折 + 延迟退房 + 免费升级房型。"

  - id: "member_points"
    category: "membership"
    keywords: ["积分", "积分兑换", "兑换"]
    content: "消费 ¥1 积 1 分。5000 分可兑换标准间一晚，10000 分可兑换大床房一晚，20000 分可兑换套房一晚。积分有效期 12 个月。"

  # ============ 调价经验知识 ============
  - id: "pricing_high_occupancy"
    category: "pricing"
    keywords: ["调价", "涨价", "旺季", "入住率高"]
    content: "历史经验：入住率超过 80% 时，商务套房和豪华套房建议涨价 10-15%；入住率超过 90% 时，全房型建议涨价 15-20%。但总统套房涨价超过 15% 曾引发客户投诉。"

  - id: "pricing_low_occupancy"
    category: "pricing"
    keywords: ["降价", "淡季", "入住率低", "促销"]
    content: "历史经验：入住率低于 40% 时，标准间和大床房建议降价 10-20% 以提升入住率。降价 15% 以上通常能带来 30% 以上的入住率提升。亲子房在周末提价 5-10% 需求仍然旺盛。"

  - id: "pricing_seasonal"
    category: "pricing"
    keywords: ["季节性", "节假日", "黄金周", "春节", "国庆"]
    content: "历史经验：春节和国庆期间，所有房型可涨价 20-30%。暑假期间亲子房可涨价 15-25%。圣诞节期间爱情房间需求旺盛，可涨价 10-15%。"

  # ============ 常见问题 ============
  - id: "wifi"
    category: "faq"
    keywords: ["wifi", "无线", "网络", "上网", "密码"]
    content: "全酒店覆盖免费高速 Wi-Fi。连接名称为 TianXi-Hotel，验证方式为房号 + 手机号后四位。"

  - id: "invoice"
    category: "faq"
    keywords: ["发票", "开票", "报销"]
    content: "退房时在前台开具电子发票或纸质发票。电子发票发送至预留邮箱，纸质发票当场打印。可开增值税普通发票和专用发票。"

  - id: "nearby"
    category: "faq"
    keywords: ["附近", "周边", "景点", "商场", "美食"]
    content: "酒店周边：步行 5 分钟到万达广场，车程 15 分钟到市中心步行街，车程 30 分钟到机场。推荐附近景点：西湖公园（车程 10 分钟）、古镇老街（车程 20 分钟）。"

  - id: "lost_and_found"
    category: "faq"
    keywords: ["遗失", "丢失", "遗忘", "失物招领"]
    content: "退房后发现物品遗落，请拨打前台电话转 0 查询。确认后可选择到店自取或快递到付寄回。贵重物品建议在入住期间使用客房保险箱。"
